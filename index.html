<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Dashboard</title>
    <style>
        :root {
            --bg-cream: #faf6f0;
            --paper-white: #ffffff;
            --moss-green: #4a5d4e;
            --sage: #8f9f8f;
            --terracotta: #d98a6c;
            --charcoal: #2d332f;
            --organic-radius-1: 30px 15px 40px 20px;
            --organic-radius-2: 20px 40px 25px 35px;
            --hand-font: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--hand-font);
            background-color: var(--bg-cream);
            color: var(--charcoal);
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            background-image: 
                radial-gradient(var(--sage) 0.5px, transparent 0.5px), 
                radial-gradient(var(--sage) 0.5px, var(--bg-cream) 0.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Whimsical Botanical Accent Elements */
        body::before {
            content: "✿";
            position: fixed;
            bottom: 20px;
            left: 30px;
            font-size: 5rem;
            color: rgba(143, 159, 143, 0.15);
            pointer-events: none;
        }

        /* App Wrapper */
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 400;
            color: var(--moss-green);
            font-style: italic;
            letter-spacing: -1px;
            display: inline-block;
            position: relative;
        }

        header h1::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: var(--terracotta);
            border-radius: 50%; /* Makes it look hand-drawn */
        }

        .subtitle {
            font-size: 1rem;
            color: var(--sage);
            margin-top: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.5rem;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1.1fr 0.9fr;
            }
        }

        /* Organic Scrapbook Panels */
        .panel {
            background: var(--paper-white);
            padding: 2.5rem;
            box-shadow: 0 12px 32px rgba(74, 93, 78, 0.06);
            border: 2px solid var(--moss-green);
            transition: transform 0.3s ease;
            position: relative;
        }

        .panel-tasks {
            border-radius: var(--organic-radius-1);
        }

        .panel-timer {
            border-radius: var(--organic-radius-2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .panel:hover {
            transform: scale(1.01) rotate(0.5deg);
        }

        h2 {
            font-weight: 400;
            font-style: italic;
            color: var(--moss-green);
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Hand-sketched Inputs & Buttons */
        .input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border: 2px solid var(--sage);
            border-radius: 20px 10px 20px 15px;
            font-family: var(--hand-font);
            font-size: 1rem;
            background: transparent;
            color: var(--charcoal);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--terracotta);
        }

        button {
            font-family: var(--hand-font);
            cursor: pointer;
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--moss-green);
            background: var(--paper-white);
            color: var(--moss-green);
            font-weight: bold;
            font-size: 1rem;
            border-radius: 12px 25px 12px 20px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--moss-green);
            color: var(--paper-white);
            transform: translateY(-2px);
        }

        .btn-action {
            background: var(--terracotta);
            color: white;
            border-color: var(--terracotta);
        }
        .btn-action:hover {
            background: #c27355;
            border-color: #c27355;
        }

        /* Organic Task List */
        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px dashed var(--sage);
            animation: growIn 0.4s ease;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Custom Leaf-like Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 1.4rem;
            height: 1.4rem;
            border: 2px solid var(--moss-green);
            border-radius: 50% 0 50% 0; /* Leaf Shape! */
            cursor: pointer;
            transition: all 0.2s ease;
            display: grid;
            place-content: center;
        }

        .custom-checkbox:checked {
            background: var(--moss-green);
            transform: rotate(45deg);
        }

        .task-text {
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .completed .task-text {
            color: var(--sage);
            text-decoration: line-through;
            font-style: italic;
        }

        .btn-clear {
            border: none;
            background: none;
            color: var(--sage);
            font-size: 1.2rem;
            padding: 0 0.5rem;
        }
        .btn-clear:hover {
            color: var(--terracotta);
            background: none;
            transform: none;
        }

        /* The Sundial / Bloom Timer */
        .timer-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .timer-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-bg {
            fill: none;
            stroke: var(--bg-cream);
            stroke-width: 6;
        }

        .timer-progress {
            fill: none;
            stroke: var(--terracotta);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 628; /* 2 * PI * 100 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .time-display {
            font-size: 3rem;
            color: var(--moss-green);
            font-weight: 300;
            z-index: 2;
        }

        .timer-controls {
            display: flex;
            gap: 12px;
        }

        #growth-stage {
            font-size: 0.9rem;
            color: var(--sage);
            margin-top: 1rem;
            font-style: italic;
        }

        @keyframes growIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nomad</h1>
            <div class="subtitle">Grow through the day</div>
        </header>

        <main class="dashboard-grid">
            <section class="panel panel-tasks">
                <h2>The Daily Harvest <span id="counter" style="font-size: 1rem; color: var(--sage);">0 done</span></h2>
                
                <div class="input-wrapper">
                    <input type="text" id="task-input" placeholder="Plant a new task..." autocomplete="off">
                    <button id="add-btn">Plant</button>
                </div>

                <ul class="task-list" id="task-list">
                    </ul>
            </section>

            <section class="panel panel-timer">
                <h2>Focus Bloom</h2>
                <div class="timer-wrapper">
                    <svg class="timer-svg" viewBox="0 0 220 220">
                        <circle class="timer-bg" cx="110" cy="110" r="100"></circle>
                        <circle class="timer-progress" id="timer-ring" cx="110" cy="110" r="100"></circle>
                    </svg>
                    <div class="time-display" id="time-string">25:00</div>
                </div>

                <div class="timer-controls">
                    <button class="btn-action" id="toggle-timer">Begin</button>
                    <button id="reset-timer">Reset</button>
                </div>
                <div id="growth-stage">The soil is ready.</div>
            </section>
        </main>
    </div>

    <script>
        // --- TASKS ARCHITECTURE ---
        let tasks = JSON.parse(localStorage.getItem('nomad_tasks')) || [];
        const taskInput = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');
        const counter = document.getElementById('counter');

        function render() {
            localStorage.setItem('nomad_tasks', JSON.stringify(tasks));
            taskList.innerHTML = '';
            
            tasks.forEach((task, idx) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.done ? 'completed' : ''}`;
                li.innerHTML = `
                    <div class="task-left">
                        <input type="checkbox" class="custom-checkbox" ${task.done ? 'checked' : ''} data-id="${idx}">
                        <span class="task-text">${cleanHTML(task.text)}</span>
                    </div>
                    <button class="btn-clear" data-id="${idx}">✕</button>
                `;
                taskList.appendChild(li);
            });
            const doneCount = tasks.filter(t => t.done).length;
            counter.textContent = `${doneCount} plucked`;
        }

        function addTask() {
            const val = taskInput.value.trim();
            if(val) {
                tasks.push({ text: val, done: false });
                taskInput.value = '';
                render();
            }
        }

        taskList.addEventListener('click', (e) => {
            const id = e.target.dataset.id;
            if(!id) return;
            if(e.target.classList.contains('custom-checkbox')) {
                tasks[id].done = e.target.checked;
                render();
            } else if (e.target.classList.contains('btn-clear')) {
                tasks.splice(id, 1);
                render();
            }
        });

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') addTask(); });
        function cleanHTML(str) { return str.replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m])); }

        // --- BOTANICAL TIMER ARCHITECTURE ---
        let duration = 25 * 60;
        let timeRemaining = duration;
        let clockInterval = null;
        const ring = document.getElementById('timer-ring');
        const timeString = document.getElementById('time-string');
        const toggleTimerBtn = document.getElementById('toggle-timer');
        const resetTimerBtn = document.getElementById('reset-timer');
        const growthStage = document.getElementById('growth-stage');
        
        const circumference = 2 * Math.PI * 100;

        function updateClockDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            timeString.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            
            const offset = circumference - ((duration - timeRemaining) / duration * circumference);
            ring.style.strokeDashoffset = offset;

            // Whimsical text changes based on session progress
            const pct = (timeRemaining / duration) * 100;
            if (pct === 100) growthStage.textContent = "The soil is ready.";
            else if (pct > 75) growthStage.textContent = "A seed breaks open...";
            else if (pct > 40) growthStage.textContent = "Sprouting upward into the light.";
            else if (pct > 5) growthStage.textContent = "Leaves are forming smoothly.";
            else growthStage.textContent = "Almost ready to bloom!";
        }

        function toggleClock() {
            if(clockInterval) {
                clearInterval(clockInterval);
                clockInterval = null;
                toggleTimerBtn.textContent = 'Resume';
            } else {
                toggleTimerBtn.textContent = 'Pause';
                clockInterval = setInterval(() => {
                    if(timeRemaining > 0) {
                        timeRemaining--;
                        updateClockDisplay();
                    } else {
                        clearInterval(clockInterval);
                        clockInterval = null;
                        growthStage.textContent = "Fully bloomed! Take a restful break.";
                        alert("Your focus session has bloomed into a beautiful flower. Time to rest.");
                        resetClock();
                    }
                }, 1000);
            }
        }

        function resetClock() {
            clearInterval(clockInterval);
            clockInterval = null;
            timeRemaining = duration;
            toggleTimerBtn.textContent = 'Begin';
            updateClockDisplay();
        }

        toggleTimerBtn.addEventListener('click', toggleClock);
        resetTimerBtn.addEventListener('click', resetClock);

        // Init
        render();
        updateClockDisplay();
    </script>
</body>
</html>
