<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Hub // Dashboard</title>
    <style>
        :root {
            --bg-cream: #faf6f0;
            --paper-white: #ffffff;
            --moss-green: #4a5d4e;
            --sage: #c27355;
            --terracotta: #d98a6c;
            --charcoal: #2d332f;
            --organic-radius-1: 30px 15px 40px 20px;
            --organic-radius-2: 20px 40px 25px 35px;
            --hand-font: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--hand-font);
            background-color: var(--bg-cream);
            color: var(--charcoal);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: 
                radial-gradient(var(--sage) 0.5px, transparent 0.5px), 
                radial-gradient(var(--sage) 0.5px, var(--bg-cream) 0.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            overflow: hidden;
        }

        /* --- THEMED MAIN CONTAINER FRAME --- */
        .hub-container {
            width: 100%;
            max-width: 850px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* Header Setup */
        .hub-header {
            margin-bottom: 3rem;
        }

        .hub-title {
            font-size: 3rem;
            font-weight: 400;
            font-style: italic;
            color: var(--moss-green);
        }

        .hub-subtitle {
            font-size: 1rem;
            color: var(--charcoal);
            opacity: 0.8;
            margin-top: 0.5rem;
            font-style: italic;
        }

        /* Grid Layout for Modules */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 3rem;
        }

        /* --- NAVIGATION INTERACTION TILES --- */
        .module-tile {
            background: var(--paper-white);
            border: 2px solid var(--moss-green);
            padding: 3.5rem 2rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 12px 32px rgba(74, 93, 78, 0.06);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .module-tile:nth-child(1) {
            border-radius: var(--organic-radius-1);
        }

        .module-tile:nth-child(2) {
            border-radius: var(--organic-radius-2);
        }

        .module-tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 40px rgba(217, 138, 108, 0.15);
            border-color: var(--terracotta);
        }

        .tile-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
            transition: transform 0.2s ease;
        }

        .module-tile:hover .tile-icon {
            transform: scale(1.12);
        }

        .tile-title {
            font-size: 1.6rem;
            font-weight: 400;
            font-style: italic;
            color: var(--moss-green);
            margin-bottom: 0.5rem;
        }

        .tile-desc {
            font-size: 0.95rem;
            color: var(--charcoal);
            opacity: 0.75;
            line-height: 1.4;
        }

        @media (max-width: 640px) {
            .modules-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            body {
                overflow: auto;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <header class="hub-header">
            <h1 class="hub-title">Nomad Hub</h1>
            <p class="hub-subtitle">Choose an environment to organize your thoughts and time.</p>
        </header>

        <nav class="modules-grid">
            <a href="notes.html" class="module-tile">
                <span class="tile-icon">✍️</span>
                <h2 class="tile-title">Nomad Notes</h2>
                <p class="tile-desc">Write rich text records, logs, and thoughts inside organized custom files.</p>
            </a>

            <a href="focus.html" class="module-tile">
                <span class="tile-icon">⏳</span>
                <h2 class="tile-title">Nomad Focus</h2>
                <p class="tile-desc">Manage concentration intervals, track deep work sessions, and view task cycles.</p>
            </a>
        </nav>
    </div>

</body>
</html>
