<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Notes // Workspace</title>
    <style>
        html {
            overflow:hidden;
            overscroll-behavior: none;
        }
        :root {
            --bg-cream: #faf6f0;
            --paper-white: #ffffff;
            --moss-green: #4a5d4e;
            --sage: #c27355;
            --terracotta: #d98a6c;
            --charcoal: #2d332f;
            --organic-radius-1: 30px 15px 40px 20px;
            --organic-radius-2: 20px 40px 25px 35px;
            --hand-font: 'Georgia', serif;
            --line-height: 24px; /* Adjust this value to increase/decrease spacing between lines on the paper canvas */
            --overscroll-behavior: none;
            --overscroll-behavior-y:none;
            --overscroll-behavior-x:none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--hand-font);
            background-color: var(--bg-cream);
            color: var(--charcoal);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: 
                radial-gradient(var(--sage) 0.5px, transparent 0.5px), 
                radial-gradient(var(--sage) 0.5px, var(--bg-cream) 0.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            
            /* ADD THESE TO SHIELD THE ROOT FROM MOMENTUM */
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* --- APP CONTAINER SYSTEM --- */
        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 3rem);
        }

        /* --- SIDEBAR PANEL --- */
        .sidebar-panel {
            background: var(--paper-white);
            border: 2px solid var(--moss-green);
            box-shadow: 0 12px 32px rgba(74, 93, 78, 0.06);
            border-radius: var(--organic-radius-1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 94vh;
        }

        /* Notebook Selector Menu Styles */
        .notebook-menu-container {
            margin-bottom: 1.5rem;
            border-bottom: 1px dashed var(--moss-green);
            padding-bottom: 1rem;
        }

        .notebook-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sage);
            font-weight: bold;
            display: block;
            margin-bottom: 0.4rem;
        }

        .notebook-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            width: 100%;
        }

        .notebook-select {
            flex: 1;
            max-width: 165px;
            font-family: var(--hand-font);
            font-size: 1.1rem;
            font-style: italic;
            padding: 0.4rem;
            border: 1px solid var(--moss-green);
            border-radius: 6px;
            background: var(--bg-cream);
            color: var(--charcoal);
            outline: none;
            cursor: pointer;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .notebook-select option {
            font-style: italic;
            background: var(--paper-white);
            color: var(--charcoal);
        }

        .btn-notebook-action {
            font-family: var(--hand-font);
            background: var(--paper-white);
            border: 1px solid var(--moss-green);
            color: var(--moss-green);
            border-radius: 6px;
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.15s ease;
            white-space: nowrap;
            height: 35px;
        }
        .btn-notebook-action:hover {
            background: var(--bg-cream);
            color: var(--terracotta);
        }

        button.btn-add {
            font-family: var(--hand-font);
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            background: var(--terracotta);
            color: white;
            border: 2px solid var(--terracotta);
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            border-radius: 12px 25px 12px 20px;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }

        button.btn-add:hover {
            background: #c27355;
            border-color: #c27355;
            transform: translateY(-1px);
        }

        .list-container {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding-right: 0.25rem;
        }

        .item-page {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-style: italic;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 10px 18px 10px 14px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .item-page:hover {
            background: var(--bg-cream);
        }

        .item-page.active {
            background: var(--bg-cream);
            border-color: var(--sage);
        }

        .text-truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1.05rem;
            color: var(--charcoal);
            max-width: 180px;
        }

        .btn-remove {
            background: none;
            border: none;
            color: var(--sage);
            cursor: pointer;
            font-size: 1rem;
            padding: 0 0.25rem;
        }
        .btn-remove:hover { 
            color: var(--terracotta); 
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        button.btn-action-io {
            font-family: var(--hand-font);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0.5rem;
            background: transparent;
            width: 100%;
            color: var(--moss-green);
            border: 1px dashed var(--moss-green);
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        button.btn-action-io:hover {
            background: var(--bg-cream);
        }

        /* --- MAIN WORKSPACE PANEL --- */
        .workspace-panel {
            background: var(--paper-white);
            border: 2px solid var(--moss-green);
            box-shadow: 0 12px 32px rgba(74, 93, 78, 0.06);
            border-radius: var(--organic-radius-2);
            padding: 3rem 2.5rem 2.5rem 4rem;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 94vh;
            overscroll-behavior: none;
        }

        .workspace-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 3.2rem;
            bottom: 0;
            width: 1px;
            background: rgba(217, 138, 108, 0.4);
        }

        /* Empty State Screen Placeholder */
        .empty-notebook-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            color: var(--moss-green);
        }

        .empty-state-title {
            font-size: 2rem;
            font-style: italic;
            font-weight: 400;
            margin-bottom: 1rem;
        }

        .empty-state-desc {
            font-size: 1.1rem;
            max-width: 400px;
            line-height: 1.5;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }

        .btn-empty-create {
            font-family: var(--hand-font);
            background: var(--terracotta);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 12px 25px 12px 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(217, 138, 108, 0.2);
        }

        .toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 0.75rem;
            position: relative;
            z-index: 5;
        }

        .btn-tool {
            font-family: var(--hand-font);
            font-size: 0.85rem;
            padding: 0.2rem 0.6rem;
            background: var(--paper-white);
            border: 1px solid var(--moss-green);
            color: var(--moss-green);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-tool:hover { background: var(--bg-cream); }
        .btn-tool.bold-indicator { font-weight: bold; }
        .btn-tool.italic-indicator { font-style: italic; }
        .btn-tool.underline-indicator { text-decoration: underline; }
        .btn-tool.active {
            background: var(--terracotta) !important;
            color: #ffffff !important;
            border-color: var(--terracotta) !important;
        }

        .title-container {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        input.title-input {
            flex: 1;
            font-family: var(--hand-font);
            font-style: italic;
            border: none;
            outline: none;
            background: transparent;
            font-weight: 400;
            font-size: 2.2rem;
            color: var(--moss-green);
            padding-bottom: 0.5rem;
        }

        .btn-export-single {
            font-family: var(--hand-font);
            font-size: 0.85rem;
            color: var(--sage);
            background: none;
            border: none;
            cursor: pointer;
            font-style: italic;
            text-decoration: underline;
            white-space: nowrap;
        }
        .btn-export-single:hover { color: var(--terracotta); }

        /* --- PAPER RULED LINE GRID MATRICES --- */
        .scrolling-paper-frame {
            flex: 1;
            position: relative;
            overflow-y: auto;
            background-image: linear-gradient(rgba(143, 159, 143, 0.25) 1px, transparent 1px);
            background-size: 100% var(--line-height);
            background-attachment: local;

            /* ADD THIS LINE TO KILL THE INTERNAL MOMENTUM BOUNCE */
            overscroll-behavior-y: contain; 
        }

        div.rich-editor-canvas {
            width: 100%;
            height: 100%;
            font-family: var(--hand-font);
            color: var(--charcoal);
            background: transparent;
            border: none;
            outline: none;
            white-space: pre-wrap;
            font-size: 16px; 
            line-height: var(--line-height);
            padding-top: 6px; /* Adjust for better vertical alignment with lines */
        }

        /* --- POPUP DIALOG FRAMEWORKS --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45, 51, 47, 0.45);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.modal-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--paper-white);
            border: 2px solid var(--moss-green);
            padding: 2rem;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(74, 93, 78, 0.12);
            border-radius: var(--organic-radius-1);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0.92);
        }

        .modal-overlay.modal-visible .modal-box { transform: scale(1); }

        .modal-title {
            font-size: 1.4rem;
            color: var(--moss-green);
            margin-bottom: 1rem;
            font-style: italic;
        }

        .modal-desc {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--charcoal);
            margin-bottom: 1.5rem;
        }

        .modal-input {
            width: 100%;
            font-family: var(--hand-font);
            font-style: italic;
            padding: 0.6rem;
            font-size: 1rem;
            border: 1px solid var(--moss-green);
            border-radius: 6px;
            margin-bottom: 1.2rem;
            outline: none;
            background: var(--bg-cream);
        }

        .modal-btn-stack {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .modal-btn {
            font-family: var(--hand-font);
            padding: 0.6rem 1rem;
            border: 1px solid var(--moss-green);
            background: var(--paper-white);
            color: var(--moss-green);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 8px 16px 8px 14px;
            transition: all 0.2s ease;
        }
        .modal-btn:hover { background: var(--bg-cream); }
        .modal-btn.btn-primary-action {
            background: var(--terracotta);
            color: white;
            border-color: var(--terracotta);
        }
        .modal-btn.btn-primary-action:hover {
            background: #c27355;
            border-color: #c27355;
        }

        @media (max-width: 768px) {
            .app-container { grid-template-columns: 1fr; height: auto; }
            body { overflow: auto; height: auto; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--sage); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar-panel">
            <div class="notebook-menu-container">
                <span class="notebook-label">Active Library</span>
                <div class="notebook-selector-wrapper">
                    <select class="notebook-select" id="notebook-dropdown"></select>
                    <button class="btn-notebook-action" id="create-notebook-btn" title="Create New Notebook">+</button>
                    <button class="btn-notebook-action" id="delete-notebook-btn" title="Delete Current Notebook">🗑</button>
                </div>
            </div>

            <button class="btn-add" id="add-page-btn">+ New Page</button>
            <ul class="list-container" id="page-list-wrapper"></ul>
            
            <div class="sidebar-actions">
                <button class="btn-action-io" id="import-btn">📂 Import Notebook</button>
                <button class="btn-action-io" id="export-all-btn">⬇ Export Active Notebook</button>
            </div>
            <input type="file" id="file-picker" accept=".json" style="display: none;">
        </aside>

        <main class="workspace-panel">
            <div id="active-editor-view" style="display: none; flex-direction: column; height: 100%; width: 100%;">
                <div class="toolbar">
                    <button class="btn-tool bold-indicator" id="btn-bold" title="Toggle Bold (Ctrl/Cmd+B)">B</button>
                    <button class="btn-tool italic-indicator" id="btn-italic" title="Toggle Italic (Ctrl/Cmd+I)">I</button>
                    <button class="btn-tool underline-indicator" id="btn-underline" title="Toggle Underline (Ctrl/Cmd+U)">U</button>
                </div>
                <div class="title-container">
                    <input type="text" id="editor-title" class="title-input" placeholder="Untitled Page" autocomplete="off">
                    <button class="btn-export-single" id="export-single-btn" title="Export entry as JSON file">Export Note</button>
                </div>
                <div class="scrolling-paper-frame">
                    <div id="editor-body" class="rich-editor-canvas" contenteditable="true" role="textbox" aria-multiline="true"></div>
                </div>
            </div>

            <div id="blank-notebook-state" class="empty-notebook-state">
                <h2 class="empty-state-title">No Notebook Open</h2>
                <p class="empty-state-desc">Create or choose an environment path workspace folder from your active library selector block above to track entries.</p>
                <button class="btn-empty-create" id="empty-state-action-btn">+ Create Notebook</button>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <h3 class="modal-title" id="modal-title-text">Dialog Window</h3>
            <p class="modal-desc" id="modal-desc-text">Context structural validation text lines.</p>
            <input type="text" id="modal-text-input" class="modal-input" style="display: none;" autocomplete="off" maxlength="24">
            <div class="modal-btn-stack" id="modal-actions-container"></div>
        </div>
    </div>

    <script>
        // Multi-Notebook Datastructure Matrix System
        let notebooks = JSON.parse(localStorage.getItem('nomad_notebooks_library')) || {};
        let activeNotebookKey = localStorage.getItem('nomad_active_notebook_key') || null;
        let activePageId = localStorage.getItem('nomad_active_page_id') || null;

        const notebookDropdown = document.getElementById('notebook-dropdown');
        const createNotebookBtn = document.getElementById('create-notebook-btn');
        const deleteNotebookBtn = document.getElementById('delete-notebook-btn');
        const emptyStateActionBtn = document.getElementById('empty-state-action-btn');
        
        const pageListWrapper = document.getElementById('page-list-wrapper');
        const activeEditorView = document.getElementById('active-editor-view');
        const blankNotebookState = document.getElementById('blank-notebook-state');
        const editorTitle = document.getElementById('editor-title');
        const editorBody = document.getElementById('editor-body');
        const addPageBtn = document.getElementById('add-page-btn');
        
        const exportAllBtn = document.getElementById('export-all-btn');
        const exportSingleBtn = document.getElementById('export-single-btn');
        const importBtn = document.getElementById('import-btn');
        const filePicker = document.getElementById('file-picker');

        const customModal = document.getElementById('custom-modal');
        const modalTitleText = document.getElementById('modal-title-text');
        const modalDescText = document.getElementById('modal-desc-text');
        const modalTextInput = document.getElementById('modal-text-input');
        const modalActionsContainer = document.getElementById('modal-actions-container');
        
        const btnBold = document.getElementById('btn-bold');
        const btnItalic = document.getElementById('btn-italic');
        const btnUnderline = document.getElementById('btn-underline');

        function updateButtonHighlights() {
            if (document.activeElement !== editorBody) return;
            btnBold.classList.toggle('active', document.queryCommandState('bold'));
            btnItalic.classList.toggle('active', document.queryCommandState('italic'));
            btnUnderline.classList.toggle('active', document.queryCommandState('underline'));
        }

        document.addEventListener('selectionchange', updateButtonHighlights);

        btnBold.addEventListener('click', () => { document.execCommand('bold', false, null); editorBody.focus(); updateButtonHighlights(); });
        btnItalic.addEventListener('click', () => { document.execCommand('italic', false, null); editorBody.focus(); updateButtonHighlights(); });
        btnUnderline.addEventListener('click', () => { document.execCommand('underline', false, null); editorBody.focus(); updateButtonHighlights(); });

        editorBody.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                const key = e.key.toLowerCase();
                if (['b', 'i', 'u'].includes(key)) {
                    e.preventDefault();
                    document.execCommand(key === 'b' ? 'bold' : key === 'i' ? 'italic' : 'underline', false, null);
                    updateButtonHighlights();
                }
            }
            if (e.key === 'Tab') {
                e.preventDefault(); 
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                const range = selection.getRangeAt(0);
                const tabNode = document.createTextNode('    ');
                range.insertNode(tabNode);
                range.setStartAfter(tabNode);
                range.setEndAfter(tabNode);
                selection.removeAllRanges();
                selection.addRange(range);
                handleLiveTyping();
            }
        });

        function triggerCustomPopup(title, description, buttonsConfigArray, showInputField = false, defaultInputValue = "") {
            modalTitleText.textContent = title;
            modalDescText.textContent = description;
            modalActionsContainer.innerHTML = '';
            
            if (showInputField) {
                modalTextInput.style.display = 'block';
                modalTextInput.value = defaultInputValue;
                setTimeout(() => modalTextInput.focus(), 50);
            } else {
                modalTextInput.style.display = 'none';
            }

            buttonsConfigArray.forEach(btnConfig => {
                const btnElement = document.createElement('button');
                btnElement.textContent = btnConfig.label;
                btnElement.className = `modal-btn ${btnConfig.isPrimary ? 'btn-primary-action' : ''}`;
                
                btnElement.addEventListener('click', () => {
                    const textValue = modalTextInput.value.trim();
                    closeCustomPopup();
                    if(btnConfig.actionCallback) btnConfig.actionCallback(textValue);
                });
                modalActionsContainer.appendChild(btnElement);
            });

            customModal.classList.add('modal-visible');
        }

        function closeCustomPopup() {
            customModal.classList.remove('modal-visible');
        }

        function save() {
            localStorage.setItem('nomad_notebooks_library', JSON.stringify(notebooks));
            localStorage.setItem('nomad_active_notebook_key', activeNotebookKey);
            localStorage.setItem('nomad_active_page_id', activePageId);
        }

        function renderNotebookDropdown() {
            notebookDropdown.innerHTML = '';
            const notebookKeys = Object.keys(notebooks);
            
            if(notebookKeys.length === 0) {
                activeNotebookKey = null;
                activePageId = null;
                notebookDropdown.innerHTML = `<option value="">(None)</option>`;
                return;
            }

            notebookKeys.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = key;
                if(key === activeNotebookKey) opt.selected = true;
                notebookDropdown.appendChild(opt);
            });
        }

        function renderSidebar() {
            pageListWrapper.innerHTML = '';
            
            if (!activeNotebookKey || !notebooks[activeNotebookKey] || notebooks[activeNotebookKey].length === 0) {
                activeEditorView.style.display = 'none';
                blankNotebookState.style.display = activeNotebookKey ? 'none' : 'flex';
                return;
            }

            blankNotebookState.style.display = 'none';
            activeEditorView.style.display = 'flex';

            notebooks[activeNotebookKey].forEach(page => {
                const li = document.createElement('li');
                li.className = `item-page ${page.id === activePageId ? 'active' : ''}`;
                li.setAttribute('data-id', page.id);
                
                let cleanPreview = page.title.trim() || page.body.replace(/<[^>]*>/g, '').substring(0, 15) || 'Untitled Page';
                if(page.title) cleanPreview = page.title;

                li.innerHTML = `
                    <span class="text-truncate" data-id="${page.id}">${escapeHTML(cleanPreview)}</span>
                    <button class="btn-remove" data-id="${page.id}">✕</button>
                `;
                pageListWrapper.appendChild(li);
            });
        }

        function loadActivePage() {
            if (!activeNotebookKey || !notebooks[activeNotebookKey]) {
                activeEditorView.style.display = 'none';
                blankNotebookState.style.display = 'flex';
                return;
            }

            const currentPages = notebooks[activeNotebookKey];
            const activePage = currentPages.find(p => p.id === activePageId);
            
            if (activePage) {
                activeEditorView.style.display = 'flex';
                blankNotebookState.style.display = 'none';
                editorTitle.value = activePage.title;
                editorBody.innerHTML = activePage.body;
            } else {
                activeEditorView.style.display = 'none';
                if(currentPages.length === 0) {
                    blankNotebookState.style.display = 'none';
                    createPage();
                }
            }
        }

        function createPage() {
            if (!activeNotebookKey) return;
            const newId = 'page_' + Date.now();
            const newPage = { id: newId, title: '', body: '' };
            notebooks[activeNotebookKey].push(newPage);
            activePageId = newId;
            
            save();
            renderSidebar();
            loadActivePage();
            editorTitle.focus();
        }

        function handleLiveTyping() {
            if (!activeNotebookKey) return;
            const currentPages = notebooks[activeNotebookKey];
            const activePage = currentPages.find(p => p.id === activePageId);
            if (activePage) {
                activePage.title = editorTitle.value;
                activePage.body = editorBody.innerHTML;
                save();
                
                const matchItem = document.querySelector(`.item-page[data-id="${activePageId}"] .text-truncate`);
                if (matchItem) {
                    matchItem.textContent = editorTitle.value || editorBody.textContent.substring(0, 15) || 'Untitled Page';
                }
            }
        }

        function promptNewNotebookCreation() {
            triggerCustomPopup(
                "New Notebook",
                "Enter a label for your notebook (Max 24 characters):",
                [
                    {
                        label: "Create Notebook",
                        isPrimary: true,
                        actionCallback: (name) => {
                            let cleanName = name.replace(/[^\w\s-]/gi, '').trim();
                            if(cleanName.length > 24) {
                                cleanName = cleanName.substring(0, 24);
                            }
                            
                            if(!cleanName) return;
                            if(notebooks[cleanName]) {
                                triggerCustomPopup("Label Conflict", "A ledger with that specific library path map profile parameters already exists.", [{label: "Retry", isPrimary: true}]);
                                return;
                            }
                            notebooks[cleanName] = [];
                            activeNotebookKey = cleanName;
                            activePageId = null;
                            
                            save();
                            renderNotebookDropdown();
                            renderSidebar();
                            createPage();
                        }
                    },
                    { label: "Cancel", isPrimary: false }
                ],
                true,
                "Nomad Notebook"
            );
        }

        createNotebookBtn.addEventListener('click', promptNewNotebookCreation);
        emptyStateActionBtn.addEventListener('click', promptNewNotebookCreation);

        deleteNotebookBtn.addEventListener('click', () => {
            if(!activeNotebookKey) return;
            triggerCustomPopup(
                "Destroy Notebook",
                `Are you sure you want to completely erase the notebook ledger "${activeNotebookKey}" and all files bound to its array profile path metrics permanently?`,
                [
                    {
                        label: "Erase Everything",
                        isPrimary: true,
                        actionCallback: () => {
                            delete notebooks[activeNotebookKey];
                            const remainingKeys = Object.keys(notebooks);
                            if(remainingKeys.length > 0) {
                                activeNotebookKey = remainingKeys[0];
                                activePageId = notebooks[activeNotebookKey].length > 0 ? notebooks[activeNotebookKey][0].id : null;
                            } else {
                                activeNotebookKey = null;
                                activePageId = null;
                            }
                            save();
                            renderNotebookDropdown();
                            renderSidebar();
                            loadActivePage();
                        }
                    },
                    { label: "Keep Safe", isPrimary: false }
                ]
            );
        });

        notebookDropdown.addEventListener('change', (e) => {
            const val = e.target.value;
            if(!val) return;
            activeNotebookKey = val;
            const currentPages = notebooks[activeNotebookKey] || [];
            activePageId = currentPages.length > 0 ? currentPages[0].id : null;
            
            save();
            renderSidebar();
            loadActivePage();
        });

        pageListWrapper.addEventListener('click', (e) => {
            const targetId = e.target.dataset.id;
            if (!targetId) return;

            if (e.target.classList.contains('btn-remove')) {
                e.stopPropagation();
                const targetPage = notebooks[activeNotebookKey].find(p => p.id === targetId);
                const displayTitle = (targetPage && targetPage.title.trim()) ? targetPage.title : 'Untitled Page';

                triggerCustomPopup(
                    "Delete Page",
                    `Are you sure you want to permanently delete "${displayTitle}"? This action cannot be undone.`,
                    [
                        {
                            label: "Delete Permanently",
                            isPrimary: true,
                            actionCallback: () => {
                                notebooks[activeNotebookKey] = notebooks[activeNotebookKey].filter(p => p.id !== targetId);
                                if (activePageId === targetId) {
                                    activePageId = notebooks[activeNotebookKey].length > 0 ? notebooks[activeNotebookKey][0].id : null;
                                }
                                save();
                                renderSidebar();
                                loadActivePage();
                            }
                        },
                        { label: "Keep Note", isPrimary: false }
                    ]
                );
            } else {
                activePageId = targetId;
                save();
                renderSidebar();
                loadActivePage();
            }
        });

        function downloadDataAsJSON(dataObj, preferredFilename) {
            const parsedDataString = JSON.stringify(dataObj, null, 4);
            const dataBlob = new Blob([parsedDataString], { type: 'application/json' });
            const temporaryAnchor = document.createElement('a');
            temporaryAnchor.href = URL.createObjectURL(dataBlob);
            temporaryAnchor.download = preferredFilename;
            document.body.appendChild(temporaryAnchor);
            temporaryAnchor.click();
            document.body.removeChild(temporaryAnchor);
        }

        exportSingleBtn.addEventListener('click', () => {
            if(!activeNotebookKey) return;
            const currentActivePage = notebooks[activeNotebookKey].find(p => p.id === activePageId);
            if (!currentActivePage) return;
            const rawTitle = currentActivePage.title.trim() || 'Untitled Page';
            const cleanFilename = rawTitle.toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'untitled';
            downloadDataAsJSON(currentActivePage, `nomad-note-${cleanFilename}.json`);
        });

        exportAllBtn.addEventListener('click', () => {
            if (!activeNotebookKey || notebooks[activeNotebookKey].length === 0) {
                triggerCustomPopup("Export Blocked", "There are no data assets inside this ledger to capture.", [{ label: "Close", isPrimary: true }]);
                return;
            }
            downloadDataAsJSON(notebooks[activeNotebookKey], `nomad-notebook-${activeNotebookKey.toLowerCase().replace(/\s+/g, '-')}.json`);
        });

        importBtn.addEventListener('click', () => { filePicker.value = ''; filePicker.click(); });
        filePicker.addEventListener('change', (event) => {
            const selectedFile = event.target.files[0];
            if (!selectedFile) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const extractedData = JSON.parse(e.target.result);
                    const isNotebookArray = Array.isArray(extractedData);
                    
                    // Deduce a notebook title targeting schema parameters from the raw filename structure
                    let derivedNotebookName = selectedFile.name.replace(/\.json$/i, '')
                                                              .replace(/^nomad-notebook-/i, '')
                                                              .replace(/^nomad-note-/i, '')
                                                              .replace(/[-_]+/g, ' ').trim();
                    if(derivedNotebookName.length > 24) derivedNotebookName = derivedNotebookName.substring(0, 24);
                    if(!derivedNotebookName) derivedNotebookName = "Imported Notebook";

                    // AUTO-GENERATE CONTAINER INTERCEPTOR: If no notebook exists, establish one instantly from context
                    let targetNotebookKey = activeNotebookKey;
                    if (!targetNotebookKey) {
                        targetNotebookKey = derivedNotebookName;
                        notebooks[targetNotebookKey] = [];
                    }

                    if (isNotebookArray) {
                        triggerCustomPopup(
                            "Import Notebook Stack",
                            `Import profile contains ${extractedData.length} records. Merge into notebook ledger "${targetNotebookKey}"?`,
                            [
                                {
                                    label: "Append Assets",
                                    isPrimary: true,
                                    actionCallback: () => {
                                        extractedData.forEach(item => {
                                            if(item.body !== undefined) {
                                                notebooks[targetNotebookKey].push({
                                                    id: 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                                                    title: item.title || '',
                                                    body: item.body || ''
                                                });
                                            }
                                        });
                                        activeNotebookKey = targetNotebookKey;
                                        const currentPages = notebooks[activeNotebookKey];
                                        activePageId = currentPages.length > 0 ? currentPages[0].id : null;
                                        save(); renderNotebookDropdown(); renderSidebar(); loadActivePage();
                                    }
                                },
                                { label: "Abort", isPrimary: false }
                            ]
                        );
                    } else if (extractedData && extractedData.body !== undefined) {
                        // Singular file routing engine pathway
                        notebooks[targetNotebookKey].push({
                            id: 'page_' + Date.now(),
                            title: extractedData.title || '',
                            body: extractedData.body || ''
                        });
                        activeNotebookKey = targetNotebookKey;
                        activePageId = 'page_' + Date.now();
                        save(); renderNotebookDropdown(); renderSidebar(); loadActivePage();
                    } else {
                        triggerCustomPopup("Invalid Format", "The uploaded JSON file layout schema configuration matrix could not be resolved.", [{ label: "Close", isPrimary: true }]);
                    }
                } catch (err) {
                    triggerCustomPopup("Parsing Error", "The profile parameters layout schema validation failed.", [{ label: "Close", isPrimary: true }]);
                }
            };
            reader.readAsText(selectedFile);
        });

        addPageBtn.addEventListener('click', createPage);
        editorTitle.addEventListener('input', handleLiveTyping);
        editorBody.addEventListener('input', handleLiveTyping);

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // Setup Initialization Hooks
        renderNotebookDropdown();
        renderSidebar();
        loadActivePage();
    </script>
</body>
</html>
